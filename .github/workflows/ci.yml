name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kingfisher_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d kingfisher_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/kingfisher_test
      DIRECT_URL: postgresql://test:test@localhost:5432/kingfisher_test
      REDIS_ENABLED: 'true'
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ci-test-jwt-access-secret-min-32-chars-long
      JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-min-32-chars-long
      JWT_SECRETS_STRICT: 'false'
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npx prisma migrate deploy

      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx prisma validate
      - run: npm test -- --passWithNoTests

      # E2E + live smoke scripts require a full JWT/portal secret set and a long-running
      # app boot — run locally before release: npm run test:e2e

      - run: npm run build

      - name: Docker build
        run: docker build -t kingfisher-backend:ci .
